# Fallback pricing table for the dashboard.
#
# ONLY used when a SpendEntry lands with `cost_usd == 0` (or None) — typical
# for opencode / local codex where there's no billing pipe. When `cost_usd`
# already has a real number, we honor that and ignore this file.
#
# Overridable per project: drop a `pricing.yaml` at the project root and its
# `models:` map is layered on top of these defaults (project keys win). Keys
# that don't exist in either fall through to `default`.
#
# Prices are USD per 1M tokens. `cache_read` and `cache_write` price the
# part of the input read from and written to the prompt cache; a row without
# them prices cached tokens at `input`. cache_write is the 5-minute write
# (1.25x input).
#
# as_of is when the Anthropic rows were last checked against the published
# price list. Re-check it when a new model generation ships.
as_of: 2026-10-06
models:
  # The aliases the packaged claude routes use (#534); the claude CLI runs
  # the current model of each family, priced below.
  opus:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  sonnet:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  haiku:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
    cache_write: 12.50
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write: 3.75
  claude-opus-4-7:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
  gpt-5:
    input: 2.50
    output: 10.00
  gpt-5-mini:
    input: 0.50
    output: 2.00
  codex:
    input: 1.00
    output: 4.00
  opencode/deepseek-v4-pro:
    input: 0.50
    output: 2.00
  opencode-go/glm-5.1:
    input: 0.30
    output: 1.20
  # Antigravity gateway (agy CLI) — Google Gemini underlying models.
  gemini-3.1-pro-high:
    input: 1.25
    output: 5.00
  gemini-3.7-flash-medium:
    input: 0.075
    output: 0.30
  # agy 1.4's models (#382), priced as the ones they replace until agy
  # publishes their rates.
  gemini-4-argon-high:
    input: 1.25
    output: 5.00
  gemini-3.8-flash-medium:
    input: 0.075
    output: 0.30
  default:
    input: 1.00
    output: 4.00
